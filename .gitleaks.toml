[extend]
useDefault = true

[[rules]]
id = "raw-public-ipv4"
description = "Raw public IPv4 address; use DNS or environment configuration"
regex = '''\b(?:25[0-5]|2[0-4][0-9]|1?[0-9]{1,2})(?:\.(?:25[0-5]|2[0-4][0-9]|1?[0-9]{1,2})){3}\b'''
keywords = ["."]

[rules.allowlist]
description = "Non-public ranges and documented non-secret test literals"
regexTarget = "secret"
regexes = [
  '''^(?:0|10|127)\..*$''',
  '''^169\.254\..*$''',
  '''^172\.(?:1[6-9]|2[0-9]|3[01])\..*$''',
  '''^192\.168\..*$''',
  '''^192\.0\.2\..*$''',
  '''^198\.(?:1[89]\.[0-9]{1,3}|51\.100)\.[0-9]{1,3}$''',
  '''^203\.0\.113\..*$''',
  '''^(?:22[4-9]|23[0-9]|24[0-9]|25[0-5])\..*$''',
  '''^93\.184\.216\.34$''',
  '''^128\.0\.0\.0$''',
]
